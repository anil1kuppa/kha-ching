version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kha-ching-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-trading_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kha-ching-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kha-ching-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kha-ching-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kha-ching-app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
      TZ: Asia/Kolkata
      # Kite API
      KITE_API_KEY: ${KITE_API_KEY}
      KITE_API_SECRET: ${KITE_API_SECRET}
      URL: ${URL:-http://localhost:3000/api/redirect_url_kite}
      ProductionURL: ${ProductionURL}
      # Session
      SECRET_COOKIE_PASSWORD: ${SECRET_COOKIE_PASSWORD}
      # Defaults
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_LOTS: ${NEXT_PUBLIC_DEFAULT_LOTS:-2}
      NEXT_PUBLIC_DEFAULT_SKEW_PERCENT: ${NEXT_PUBLIC_DEFAULT_SKEW_PERCENT:-10}
      NEXT_PUBLIC_DEFAULT_SQUARE_OFF_TIME: ${NEXT_PUBLIC_DEFAULT_SQUARE_OFF_TIME:-15:20}
      NEXT_PUBLIC_DEFAULT_SLM_PERCENT: ${NEXT_PUBLIC_DEFAULT_SLM_PERCENT:-30}
      MOCK_ORDERS: ${MOCK_ORDERS:-false}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kha-ching-network
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  kha-ching-network:
    driver: bridge
